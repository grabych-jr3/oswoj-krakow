[project]
name = "oswoj-geo"
version = "0.1.0"
description = "Geo & Data pipeline for Oswój Kraków (stream A)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "h3>=4.5.0",
    "httpx>=0.28",
    "pyproj>=3.8.0",
    "r5py>=1.1.7",
    "rapidfuzz>=3.14.6",
    "shapely>=2.2.0",
]

[project.scripts]
geo-fetch = "oswoj_geo.fetch:main"
geo-geocode = "oswoj_geo.places:main"
geo-layers = "oswoj_geo.layers:main"
geo-districts = "oswoj_geo.districts:main"
geo-parks = "oswoj_geo.parks:main"
geo-stops = "oswoj_geo.stops:main"
geo-offices = "oswoj_geo.offices:main"
geo-access = "oswoj_geo.access:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
