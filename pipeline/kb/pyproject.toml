[project]
name = "oswoj-kb"
version = "0.1.0"
description = "Knowledge Base & AI pipeline for Oswój Kraków (stream B)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "markdownify>=1.2.3",
    "pydantic>=2.14.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
