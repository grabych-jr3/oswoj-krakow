name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  zones:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check that the PR stays inside its zone
        run: bash .github/scripts/check-zones.sh "${{ github.head_ref }}" "origin/${{ github.base_ref }}"

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  pipeline-geo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline/geo
    steps:
      - uses: actions/checkout@v4
      # Runs only once the stream has created its uv project (hashFiles is allowed only at step level).
      - uses: astral-sh/setup-uv@v6
        if: hashFiles('pipeline/geo/pyproject.toml') != ''
      - run: uv run ruff check
        if: hashFiles('pipeline/geo/pyproject.toml') != ''
      - run: uv run pytest
        if: hashFiles('pipeline/geo/pyproject.toml') != ''

  pipeline-kb:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline/kb
    steps:
      - uses: actions/checkout@v4
      # Runs only once the stream has created its uv project (hashFiles is allowed only at step level).
      - uses: astral-sh/setup-uv@v6
        if: hashFiles('pipeline/kb/pyproject.toml') != ''
      - run: uv run ruff check
        if: hashFiles('pipeline/kb/pyproject.toml') != ''
      - run: uv run pytest
        if: hashFiles('pipeline/kb/pyproject.toml') != ''
